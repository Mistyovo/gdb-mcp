[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdb-mcp"
version = "0.1.0"
description = "MCP server that drives a local GDB (incl. pwndbg) for Linux binary exploitation - supports gdb launched by pwntools scripts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gdb-mcp = "gdb_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
