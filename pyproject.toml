[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdb-mcp"
version = "0.1.0"
description = "MCP server that drives a local GDB (incl. pwndbg) for Linux binary exploitation - supports gdb launched by pwntools scripts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.20",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[project.scripts]
gdb-mcp = "gdb_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["gdb_mcp"]
omit = [
    "*/gdb_mcp/__main__.py",
    "*/gdb_mcp/plugin/gdb_mcp_plugin.py",
]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
