name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests bench
      - run: python -m coverage run -m pytest
      - run: python -m coverage report

  gdb-integration:
    # gdb compatibility matrix: the plugin's gdb.* API usage must hold
    # across gdb majors, not just the 18.1 used in local WSL2 testing.
    # ubuntu-22.04 apt ships gdb 12.1, ubuntu-24.04 ships gdb 15.x;
    # local WSL2 validation covers gdb 18.1.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y gdb gcc
      - run: gdb --version | head -1
      - run: bash tests/integration/run_wsl_integration.sh
      # the policy verb family was mock-only until 2026-10-07 (mock-sync
      # semantics diverged from real gdb and every mock test stayed green);
      # this smoke keeps the real-gdb resume/stop semantics pinned on
      # every gdb major in the matrix
      - run: bash tests/integration/run_policy_smoke.sh
      # heap timeline: allocation return capture through libc's inline
      # malloc frame (the probe walks older() to the containing frame)
      - run: bash tests/integration/run_heap_smoke.sh
      # verify_pc_control: replay a canary at a known offset and pin the
      # verdict on both a controllable and a non-controllable build; also
      # pins the canonical-address premise behind the default canary
      - run: bash tests/integration/run_pc_control_smoke.sh
      # keeps the unsafe gate's command-resolution premises true on every
      # gdb major in the matrix (abbreviations, s/r/p/d, newline injection)
      - run: bash tests/integration/run_unsafe_gate_probe.sh

  native-wheel:
    # Installed-package MCP stdio regression. Older Ubuntu pairs the oldest
    # gdb in the matrix with Python 3.10; the newer runner also covers the
    # newest supported Python. The smoke itself asserts that the installed
    # wheel (not the checkout) is loaded and drives the gdb-mcp console script.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y gdb gcc
      - run: gdb --version | head -1
      - name: Installed-wheel MCP stdio smoke (native Linux)
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          python -m pip wheel . --no-deps --wheel-dir "$work/wheels"
          python -m venv "$work/venv"
          "$work/venv/bin/python" -m pip install "$work"/wheels/*.whl
          cd "$work"
          timeout --kill-after=10s 120s "$work/venv/bin/python" -I \
            "$GITHUB_WORKSPACE/tests/integration/run_native_install_smoke.py"

  bench:
    # Goal §9 regression gate: the committed selfcheck baseline is the floor.
    # A >1pp drop in any tier-1 metric fails the PR.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y gdb gcc python3-pip
      - run: python -m pip install -e ".[dev]"
      - name: Build bench targets (native Linux)
        run: python -m bench.framework.cli build --distro ""
      - name: Reference-solve every committed task
        run: python -m bench.framework.cli selfcheck --distro "" --port 39690
      - name: Tier-1 gate vs baseline
        run: |
          results=$(ls -t bench/results/selfcheck-*.summary.json | head -1)
          python -m bench.framework.cli report --results "$results" \
            --gate bench/reports/baseline.json
