name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests bench
      - run: python -m coverage run -m pytest
      - run: python -m coverage report

  gdb-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y gdb gcc
      - run: bash tests/integration/run_wsl_integration.sh

  bench:
    # Goal §9 regression gate: the committed selfcheck baseline is the floor.
    # A >1pp drop in any tier-1 metric fails the PR.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y gdb gcc python3-pip
      - run: python -m pip install -e ".[dev]"
      - name: Build bench targets (native Linux)
        run: python -m bench.framework.cli build --distro ""
      - name: Reference-solve every committed task
        run: python -m bench.framework.cli selfcheck --distro "" --port 39690
      - name: Tier-1 gate vs baseline
        run: |
          results=$(ls -t bench/results/selfcheck-*.summary.json | head -1)
          python -m bench.framework.cli report --results "$results" \
            --gate bench/reports/baseline.json
